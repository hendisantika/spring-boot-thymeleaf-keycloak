version: 2

updates:
  # Maven dependencies (pom.xml) & Maven Wrapper
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      spring-addons:
        patterns:
          - "com.c4-soft.springaddons*"
      maven-plugins:
        patterns:
          - "org.apache.maven*"
          - "*maven-plugin"
      test:
        dependency-type: development
        patterns:
          - "*"
    ignore:
      # Major Spring Boot upgrades need manual review
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [ "version-update:semver-major" ]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images used in compose.yaml (PostgreSQL & Keycloak)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docker-images:
        patterns:
          - "*"
